
<div class="min-h-screen bg-slate-100 text-slate-800 md:flex">

  <!-- Sidebar -->
  <aside class="flex w-full flex-col border-r border-slate-200 bg-white px-5 py-6 md:min-h-screen md:w-64 md:shrink-0">

    <!-- Brand -->
    <a routerLink="/" class="mb-10 flex items-center gap-3 px-2">
      <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-teal-700 text-white">
        <i class="pi pi-wallet text-xl"></i>
      </div>

      <span class="text-base font-bold leading-tight text-slate-900">
        Personal<br>Expenses Track
      </span>
    </a>

    <!-- Menu -->
    <p class="mb-4 px-2 text-xs font-semibold uppercase tracking-wider text-slate-400">
      Main Menu
    </p>

    <nav class="space-y-2">

      <a routerLink="/dashboard"
         routerLinkActive="bg-teal-50 text-teal-800"
         [routerLinkActiveOptions]="{ exact: true }"
         class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-medium text-slate-500 transition hover:bg-slate-50 hover:text-teal-700">
        <i class="pi pi-home text-lg"></i>
        Dashboard
      </a>

      <a routerLink="/user"
         routerLinkActive="bg-teal-50 text-teal-800"
         class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-medium text-slate-500 transition hover:bg-slate-50 hover:text-teal-700">
        <i class="pi pi-user-plus text-lg"></i>
        Create User
      </a>

      <a routerLink="/category"
         routerLinkActive="bg-teal-50 text-teal-800"
         class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-medium text-slate-500 transition hover:bg-slate-50 hover:text-teal-700">
        <i class="pi pi-th-large text-lg"></i>
        Category
      </a>

      <a routerLink="/transaction"
         routerLinkActive="bg-teal-50 text-teal-800"
         class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-medium text-slate-500 transition hover:bg-slate-50 hover:text-teal-700">
        <i class="pi pi-arrow-right-arrow-left text-lg"></i>
        Transaction
      </a>

    </nav>

    <!-- Bottom Section -->
    <div class="mt-auto pt-10">

      <!-- Promotional Card -->
      <div class="rounded-2xl border border-teal-100 bg-teal-50/70 p-4">

        <div class="mb-3 flex h-10 w-10 items-center justify-center rounded-xl bg-teal-100 text-teal-700">
          <i class="pi pi-chart-line text-xl"></i>
        </div>

        <h3 class="mb-1 text-sm font-semibold text-slate-900">
          Track Your Expenses
        </h3>

        <p class="mb-4 text-xs leading-5 text-slate-500">
          Manage your money smarter and simpler.
        </p>

        <a routerLink="/dashboard"
           class="flex items-center justify-center gap-2 rounded-lg bg-teal-700 px-3 py-2 text-xs font-semibold text-white transition hover:bg-teal-800">
          Get Started
          <i class="pi pi-arrow-right"></i>
        </a>

      </div>

      <!-- Logout -->
      <button type="button"
              class="mt-6 flex w-full items-center gap-3 rounded-lg px-3 py-3 text-sm font-medium text-red-600 transition hover:bg-red-50">
        <i class="pi pi-sign-out text-lg"></i>
        Logout
      </button>

    </div>

  </aside>

  <!-- Main Content -->
  <div class="min-w-0 flex-1">

    <!-- Header -->
    <header class="flex items-center justify-between border-b border-slate-200 bg-white px-6 py-4">

      <form class="w-full max-w-md">
        <div class="relative">
          <i class="pi pi-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>

          <input type="text"
                 placeholder="Search anything"
                 class="w-full rounded-xl border border-slate-200 bg-slate-50 py-2.5 pl-11 pr-4 text-sm outline-none transition focus:border-teal-500 focus:ring-2 focus:ring-teal-100">
        </div>
      </form>

      <div class="ml-4 flex items-center gap-4">

        <button class="rounded-xl border border-slate-200 p-2.5 text-slate-600 hover:bg-slate-50">
          <i class="pi pi-bell"></i>
        </button>

        <div class="flex items-center gap-2 border-l border-slate-200 pl-4">
          <div class="flex h-9 w-9 items-center justify-center rounded-full bg-teal-100 text-teal-700">
            <i class="pi pi-user"></i>
          </div>

          <span class="hidden text-sm font-medium text-slate-700 sm:block">
            My Account
          </span>

          <i class="pi pi-chevron-down text-xs text-slate-400"></i>
        </div>

      </div>

    </header>

    <!-- Page Content -->
    <main class="p-0">
      <router-outlet></router-outlet>
    </main>

  </div>

</div>
